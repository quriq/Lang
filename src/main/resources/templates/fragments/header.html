<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Фрагмент header -->
<div th:fragment="header" style="
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background-image: url('/images/header-bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
">
    <!-- Приветствие -->
    <span style="color: #996666; font-size: 14px; white-space: nowrap;">
        <span th:text="${#authentication.name}" style="color: #ffd4d4; font-weight: bold;">User</span>
    </span>

    <!-- Кнопка личного кабинета -->
    <div style="position: relative;">
        <button id="userMenuBtn" onclick="toggleUserMenu()" style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #330000;
            background-color: #1a0000;
            color: #ffd4d4;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
        " onmouseover="this.style.backgroundColor='#6f0000'; this.style.borderColor='#ff2a2a'"
                onmouseout="this.style.backgroundColor='#1a0000'; this.style.borderColor='#330000'">

        </button>

        <!-- Выпадающее меню -->
        <div id="userMenu" style="
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            width: 200px;
            background-color: #1a0000;
            border: 1px solid #330000;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 1000;
        ">
            <a th:href="@{/settings}" style="
                display: block;
                padding: 12px 16px;
                color: #ffd4d4;
                text-decoration: none;
                font-size: 14px;
                transition: background-color 0.15s ease;
            " onmouseover="this.style.backgroundColor='#6f0000'"
               onmouseout="this.style.backgroundColor='transparent'">
                ⚙️ Настройки
            </a>

            <a th:href="@{/achievements}" style="
                display: block;
                padding: 12px 16px;
                color: #996666;
                text-decoration: none;
                font-size: 14px;
                transition: background-color 0.15s ease;
            " onmouseover="this.style.backgroundColor='#6f0000'; this.style.color='#ffd4d4'"
               onmouseout="this.style.backgroundColor='transparent'; this.style.color='#996666'">
                🏆 Достижения <span style="font-size: 11px; opacity: 0.6;">(скоро)</span>
            </a>

            <div style="border-top: 1px solid #330000;"></div>

            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" style="
                    width: 100%;
                    padding: 12px 16px;
                    border: none;
                    background: transparent;
                    color: #ff2a2a;
                    font-size: 14px;
                    cursor: pointer;
                    text-align: left;
                    font-family: 'Inter', sans-serif;
                " onmouseover="this.style.backgroundColor='#6f0000'"
                        onmouseout="this.style.backgroundColor='transparent'">
                    🚪 Выйти
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
