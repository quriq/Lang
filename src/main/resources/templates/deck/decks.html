<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
        <title th:text="#{label.decks}">My Decks</title>
    </head>
    <body>
    <div class="">
        <h1 th:text="#{label.decks}">My Decks</h1>

        <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>

        <button id="openCreateDeckModal" class="btn">Создать колоду</button>
        <a th:href="@{/}" class="btn">back</a>

        <div th:if="${#lists.isEmpty(decks)}" style="margin-top: 2rem;">
            <p>No decks yet. Create your first deck!</p>
        </div>

        <div th:unless="${#lists.isEmpty(decks)}">
            <div th:each="deck : ${decks}" class="deck-card">
                <h3 th:text="${deck.name}">Deck Name</h3>
                <p><strong>Language:</strong> <span th:text="${deck.targetLanguage}">Language</span></p>
                <span th:text="${#temporals.format(deck.createdAt, 'dd.MM.yyyy')}">Date</span>
                <p><strong>Folder:</strong> <span th:if="${deck.folder != null}" th:text="${deck.folder.name}">Folder Name</span>
                    <span th:if="${deck.folder == null}"></span></p>
                <a th:href="@{/decks/{id}/cards(id=${deck.id})}" class="btn btn-primary">Карточки</a>
                <a th:href="@{/decks/{id}/edit(id=${deck.id})}" class="btn btn-primary">Редактировать</a>
                <form th:action="@{/decks/{id}/delete(id=${deck.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-primary" onclick="return confirm('Удалить колоду и все её карточки?')" >Удалить</button>
                </form>
            </div>
        </div>
    </div>

    <div id="createDeckModal" class="modal-overlay" style="display: none;">
        <div class="modal-content card">
            <h2>Новая колода</h2>

            <form th:action="@{/decks/new}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label">Название</label>
                    <input type="text" name="name" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Язык</label>
                    <input type="text" name="targetLanguage" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Папка (необязательно)</label>
                    <select name="folderId" class="form-control">
                        <option value="">Без папки</option>
                        <option th:each="folder : ${folders}"
                                th:value="${folder.id}"
                                th:text="${folder.name}"></option>
                    </select>
                </div>

                <div style="display: flex; gap: var(--spacing-sm); justify-content: flex-end; margin-top: var(--spacing-lg);">
                    <button type="submit" class="btn btn-primary">Создать</button>
                    <button type="button" class="btn btn-outline modal-close-btn">Отмена</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('createDeckModal');
            const openBtn = document.getElementById('openCreateDeckModal');
            const closeBtn = modal.querySelector('.modal-close-btn');

            // Открыть окно
            openBtn.addEventListener('click', function() {
                modal.style.display = 'flex';
            });

            // Закрыть по кнопке "Отмена"
            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
                modal.querySelector('form').reset();
            });

            // Закрыть при клике на затемнённый фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    modal.querySelector('form').reset();
                }
            });

            // Закрыть по клавише Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.style.display === 'flex') {
                    modal.style.display = 'none';
                    modal.querySelector('form').reset();
                }
            });
        });
    </script>
</body>
</html>
