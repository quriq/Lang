<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title th:text="#{label.folders}">My Folders</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1 th:text="#{label.folders}">My Folders</h1>

    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>

    <button id="openCreateFolderModal" class="btn">Создать папку</button>
    <a th:href="@{/}" class="btn btn-primary">back</a>

    <div th:if="${#lists.isEmpty(folders)}" style="margin-top: 2rem;">
        <p>No decks yet. Create your first folder!</p>
    </div>

    <div th:unless="${#lists.isEmpty(folders)}">
        <div th:each="folder : ${folders}" class="deck-card">
            <a th:href="@{/folders/{id}(id=${folder.id})}">
                <h3 th:text="${folder.name}">Folder Name</h3>
            </a>

            <div style="display: flex; gap: var(--spacing-sm);">
            <button class="btn btn-primary openEditFolderModalBtn"
                    th:data-folder-id="${folder.id}"
                    th:data-name="${folder.name}">Редактировать
            </button>
                <span th:text="${#temporals.format(folder.createdAt, 'dd.MM.yyyy')}">Date</span>

                <form th:action="@{/folders/{id}/delete(id=${folder.id})}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-primary" onclick="return confirm('Удалить папку и все её колоды?')">Удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div id="createFolderModal" class="modal-overlay" style="display: none;">
    <div class="modal-content card">
        <h2>Новая папка</h2>

        <form th:action="@{/folders/new}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label class="form-label">Название</label>
                <input type="text" name="name" class="form-control" required />
            </div>

            <div style="display: flex; gap: var(--spacing-sm); justify-content: flex-end; margin-top: var(--spacing-lg);">
                <button type="submit" class="btn btn-primary">Создать</button>
                <button type="button" class="btn btn-outline modal-close-btn">Отмена</button>
            </div>
        </form>
    </div>
</div>
<div id="editFolderModal" class="modal-overlay" style="display: none;">
    <div class="modal-content ">
        <h2 style="margin-bottom: 1rem;">Редактирование</h2>
        <form id="editForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label class="form-label">Имя папки</label>
                <input type="text" id="editName" name="newName" class="form-control" required/>
            </div>

            <div style="display: flex; gap: var(--spacing-sm); justify-content: flex-end; margin-top: var(--spacing-lg);">
                <button type="button" class="btn btn-primary modal-close-btn">Отмена</button>
                <button type="submit" class="btn">Редактировать</button>
            </div>
        </form>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('createFolderModal');
        const openBtnCreate = document.getElementById('openCreateFolderModal');
        const closeBtnCreate = modal.querySelector('.modal-close-btn');
        const createForm = document.getElementById('createForm');

        openBtnCreate.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        const closeCreateModal = () => {
            modal.style.display = 'none';
            createForm.reset();
        };
        closeBtnCreate.addEventListener('click', closeCreateModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeCreateModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeCreateModal(); });

        const modalEdit = document.getElementById('editFolderModal');
        const openBtnsEdit = document.querySelectorAll('.openEditFolderModalBtn');
        const closeBtnEdit = modalEdit.querySelector('.modal-close-btn');
        const editForm = document.getElementById('editForm');

        openBtnsEdit.forEach(btn => {
            btn.addEventListener('click', function() {
                const folderId = this.getAttribute('data-folder-id');
                const name = this.getAttribute('data-name')

                editForm.action = `folders/${folderId}/edit`;

                document.getElementById('editName').value = name;

                modalEdit.style.display = 'flex';
            });
        });
        const closeEditModal = () => {
            modalEdit.style.display = 'none';
            editForm.reset();
        };
        closeBtnEdit.addEventListener('click', closeEditModal);
        modalEdit.addEventListener('click', (e) => { if (e.target === modalEdit) closeEditModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalEdit.style.display === 'flex') closeEditModal();
        });
    });


    function toggleUserMenu() {
        const menu = document.getElementById('userMenu');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function(e) {
        const menu = document.getElementById('userMenu');
        const btn = document.getElementById('userMenuBtn');
        if (menu && !menu.contains(e.target) && e.target !== btn) {
            menu.style.display = 'none';
        }
    });

</script>
</body>
</html>
