<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title th:text="#{label.registration}">Registration</title>
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1a0000 inset !important;
            -webkit-text-fill-color: #ffd4d4 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body style="margin: 0; padding: 0;">
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #080000; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px;">

    <div style="width: 100%; max-width: 400px; background-color: #1a0000; border: 1px solid #330000; border-radius: 12px; padding: 32px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5); box-sizing: border-box;">

    <h2 style="text-align: center; margin-bottom: 24px; color: #ffd4d4; margin-top: 0;" th:text="#{label.registration}">Sign Up</h2>

        <div th:if="${param.error}" style="padding: 16px; margin-bottom: 16px; border-radius: 8px; background-color: rgba(255, 42, 42, 0.1); border-left: 4px solid #ff2a2a; color: #ff2a2a;" th:text="#{label.reg_error}">Registration failed</div>

        <div th:if="${param.success}" style="padding: 16px; margin-bottom: 16px; border-radius: 8px; background-color: rgba(0, 204, 102, 0.1); border-left: 4px solid #00cc66; color: #00cc66;" th:text="#{label.reg_success}">Registration successful!</div>

        <form th:action="@{/reg}" th:object="${user}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 4px; color: #ffd4d4; font-weight: bold; font-size: 14px;" th:text="#{label.username}">Username:</label>
                <input type="text" th:field="*{login}" style="width: 100%; padding: 8px 16px; border: 1px solid #330000; border-radius: 8px; background-color: #1a0000; color: #ffd4d4; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; outline: none; box-sizing: border-box;" required autofocus placeholder="Enter username"/>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 4px; color: #ffd4d4; font-weight: bold; font-size: 14px;" th:text="#{label.password}">Password:</label>
                <input type="password" th:field="*{psw}" style="width: 100%; padding: 8px 16px; border: 1px solid #330000; border-radius: 8px; background-color: #1a0000; color: #ffd4d4; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; outline: none; box-sizing: border-box;" required placeholder="Enter password"/>
            </div>

            <button type="submit" style="width: 100%; padding: 8px 16px; border: none; border-radius: 8px; background-color: #6f0000; color: #ffd4d4; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.15s ease; box-sizing: border-box;" onmouseover="this.style.backgroundColor='#ff2a2a'" onmouseout="this.style.backgroundColor='#6f0000'" th:text="#{button.register}">Sign Up</button>
        </form>

        <p style="text-align: center; margin-top: 24px; color: #996666; font-size: 14px;">
            Уже есть аккаунт? <a th:href="@{/login}" style="color: #ff2a2a; text-decoration: none; font-weight: bold;">Войти</a>
        </p>
    </div>
</div>
</body>
</html>
