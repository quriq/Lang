<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title th:text="#{label.registration}">Registration</title>
</head>
<body>
<div class="form-container">
    <h2 th:text="#{label.registration}">Sign Up</h2>

    <div th:if="${param.error}" class="error" th:text="#{label.reg_error}">Registration failed</div>

    <div th:if="${param.success}" class="success" th:text="#{label.reg_success}">Registration successful!</div>

    <form th:action="@{/reg}" th:object="${user}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label th:text="#{label.username}">Username:</label>
        <input type="text" th:field="*{login}" required autofocus placeholder="Enter username"/>

        <label th:text="#{label.password}">Password:</label>
        <input type="password" th:field="*{psw}" required placeholder="Enter password"/>

        <button type="submit" th:text="#{button.register}">Sign Up</button>
    </form>
</div>
</body>
</html>
