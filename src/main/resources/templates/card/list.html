    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
        <title th:text="'Карточки: ' + ${deck.name}">Карточки колоды</title>
    </head>
    <body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h1 th:text="'Карточки: ' + ${deck.name}">Название колоды</h1>
            <button id="openCreateCardModal" class="btn btn-primary">Добавить карточку</button>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div th:if="${#lists.isEmpty(cards)}" class="empty-state card" style="text-align: center; padding: 2rem;">
            <p>В этой колоде пока нет карточек.</p>
        </div>

        <div th:unless="${#lists.isEmpty(cards)}">
            <div th:each="card : ${cards}" class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div>
                    <h3 th:text="${card.frontText}">Слово</h3>
                    <p><strong>Перевод:</strong> <span th:text="${card.backText}">Перевод</span></p>
                    <p th:if="${card.exampleSentence != null and !card.exampleSentence.isEmpty()}" class="text-muted">
                        <em>Пример: <span th:text="${card.exampleSentence}">Пример предложения</span></em>
                    </p>
                </div>
                <div style="display: flex; gap: var(--spacing-sm);">
                    <button class="btn btn-primary openEditCardModalBtn"
                            th:data-deck-id="${deck.id}"
                            th:data-card-id="${card.id}"
                            th:data-front="${card.frontText}"
                            th:data-back="${card.backText}"
                            th:data-example="${card.exampleSentence}">Редактировать</button>

                    <form th:action="@{/cards/{id}/delete(id=${card.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-delete" onclick="return confirm('Удалить эту карточку?')">Удалить</button>
                    </form>
                </div>
            </div>
        </div>

        <a th:href="@{/decks}" class="btn btn-outline" style="margin-top: 1rem;">← Назад к списку колод</a>
    </div>

    <div id="createCardModal" class="modal-overlay" style="display: none;">
        <div class="modal-content card">
            <h2 style="margin-bottom: 1rem;">Новая карточка</h2>
            <form th:action="@{/decks/{deckId}/cards/new(deckId=${deck.id})}" method="post" id="createForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label">Слово/фраза</label>
                    <input type="text" name="frontText" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label class="form-label">Перевод</label>
                    <input type="text" name="backText" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label class="form-label">Пример (необязательно)</label>
                    <textarea name="exampleSentence" class="form-control"></textarea>
                </div>

                <div style="display: flex; gap: var(--spacing-sm); justify-content: flex-end; margin-top: var(--spacing-lg);">
                    <button type="button" class="btn btn-outline modal-close-btn">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>
    <div id="editCardModal" class="modal-overlay" style="display: none;">
        <div class="modal-content card">
            <h2 style="margin-bottom: 1rem;">Редактирование</h2>
            <form id="editForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label">Слово/фраза</label>
                    <input type="text" id="editFrontText" name="newFrontText" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label class="form-label">Перевод</label>
                    <input type="text" id="editBackText" name="newBackText" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label class="form-label">Пример (необязательно)</label>
                    <textarea id="editExampleSentence" name="newExampleSentence" class="form-control"></textarea>
                </div>

                <div style="display: flex; gap: var(--spacing-sm); justify-content: flex-end; margin-top: var(--spacing-lg);">
                    <button type="button" class="btn btn-primary modal-close-btn">Отмена</button>
                    <button type="submit" class="btn">Редактировать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('createCardModal');
            const openBtnCreate = document.getElementById('openCreateCardModal');
            const closeBtnCreate = modal.querySelector('.modal-close-btn');
            const createForm = document.getElementById('createForm');

            openBtnCreate.addEventListener('click', () => {
                modal.style.display = 'flex';
            });

            const closeCreateModal = () => {
                modal.style.display = 'none';
                createForm.reset();
            };
            closeBtnCreate.addEventListener('click', closeCreateModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeCreateModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeCreateModal(); });

            const modalEdit = document.getElementById('editCardModal');
            const openBtnsEdit = document.querySelectorAll('.openEditCardModalBtn');
            const closeBtnEdit = modalEdit.querySelector('.modal-close-btn');
            const editForm = document.getElementById('editForm');

            openBtnsEdit.forEach(btn => {
                btn.addEventListener('click', function() {
                    const deckId = this.getAttribute('data-deck-id');
                    const cardId = this.getAttribute('data-card-id');
                    const front = this.getAttribute('data-front');
                    const back = this.getAttribute('data-back');
                    const example = this.getAttribute('data-example') || '';

                    editForm.action = `/decks/${deckId}/cards/${cardId}/edit`;

                    document.getElementById('editFrontText').value = front;
                    document.getElementById('editBackText').value = back;
                    document.getElementById('editExampleSentence').value = example;

                    modalEdit.style.display = 'flex';
                });
            });
            const closeEditModal = () => {
                modalEdit.style.display = 'none';
                editForm.reset();
            };
            closeBtnEdit.addEventListener('click', closeEditModal);
            modalEdit.addEventListener('click', (e) => { if (e.target === modalEdit) closeEditModal(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalEdit.style.display === 'flex') closeEditModal();
            });
        });


    </script>
    </body>
    </html>
