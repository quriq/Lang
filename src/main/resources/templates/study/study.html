<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title>Тренировка</title>
</head>
<body style="margin: 0; padding: 0; background-color: #080000; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #ffd4d4;">

<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px;">

  <div style="width: 100%; max-width: 600px; background-color: #1a0000; border: 1px solid #330000; border-radius: 12px; padding: 32px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5); box-sizing: border-box; text-align: center;">

    <!-- Верхняя строка: режим + прогресс -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div style="padding: 4px 12px; border: 1px solid #330000; border-radius: 16px; background-color: #080000; font-size: 12px; color: #996666; box-sizing: border-box;">
        <span th:if="${mode == 'classic'}">📖 Классический</span>
        <span th:if="${mode == 'reverse'}">🔄 Обратный</span>
        <span th:if="${mode == 'typing'}">⌨️ Набор текста</span>
        <span th:if="${mode == 'random'}">🎲 Случайный порядок</span>
        <span th:if="${mode == 'spaced'}">⏰ Интервальное повторение</span>
      </div>

      <div style="color: #996666; font-size: 14px;">
        Карточка <span style="color: #ffd4d4; font-weight: bold;" th:text="${currentIndex}">1</span> из <span style="color: #ffd4d4; font-weight: bold;" th:text="${totalCards}">10</span>
      </div>
    </div>

    <!-- Вопрос -->
    <div style="font-size: 48px; font-weight: bold; margin: 32px 0; color: #ffd4d4; word-wrap: break-word;">
      <span th:if="${mode == 'typing' or mode == 'reverse'}" th:text="${card.backText}">Русское слово</span>
      <span th:if="${mode != 'typing' and mode != 'reverse'}" th:text="${card.frontText}">English word</span>
    </div>
    <!-- ========== РЕЖИМЫ CLASSIC / REVERSE / RANDOM / SPACED ========== -->
    <div th:if="${mode != 'typing'}">
      <button id="showAnswerBtn" onclick="toggleAnswer()" style="padding: 8px 16px; border: none; border-radius: 8px; background-color: #6f0000; color: #ffd4d4; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.15s ease; box-sizing: border-box;" onmouseover="this.style.backgroundColor='#ff2a2a'" onmouseout="this.style.backgroundColor='#6f0000'">Показать ответ</button>

      <div id="answerBlock" style="display: none; margin-top: 32px; padding-top: 32px; border-top: 1px solid #330000;">

        <!-- Перевод -->
        <div style="font-size: 32px; color: #ff2a2a; margin-bottom: 16px; word-wrap: break-word;">
          <span th:if="${mode == 'typing' or mode == 'reverse'}" th:text="${card.frontText}">Перевод1</span>
          <span th:if="${mode != 'typing' and mode != 'reverse'}" th:text="${card.backText}">Перевод2</span>
        </div>
        <!-- Пример предложения -->
        <div th:if="${example != null and !example.isEmpty()}"
             style="font-size: 18px; color: #996666; font-style: italic; margin-bottom: 32px; word-wrap: break-word;"
             th:text="${example}">Пример</div>

        <!-- ========== ФОРМА ДЛЯ РЕЖИМА FSRS (spaced) - 4 кнопки с интервалами ========== -->
        <form th:if="${mode == 'spaced'}"
              th:action="${isGlobal} ? @{/study/all/answer} : @{/decks/{deckId}/study/answer(deckId=${deckId})}"
              method="post"
              style="display: flex; justify-content: center; gap: 12px;">
          <input type="hidden" name="cardId" th:value="${card.id}" />

          <!-- AGAIN -->
          <button type="submit" name="fsrsRating" value="1"
                  style="flex: 1; padding: 12px 8px; border: 1px solid #ff2a2a; border-radius: 8px; background-color: transparent; color: #ff2a2a; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s ease;"
                  onmouseover="this.style.backgroundColor='#ff2a2a'; this.style.color='#080000'"
                  onmouseout="this.style.backgroundColor='transparent'; this.style.color='#ff2a2a'">
            <div style="font-size: 14px; font-weight: bold;">Again</div>
            <div style="font-size: 11px; margin-top: 4px; opacity: 0.8;" th:text="${fsrsAgainLabel}">10m</div>
          </button>

          <!-- HARD -->
          <button type="submit" name="fsrsRating" value="2"
                  style="flex: 1; padding: 12px 8px; border: 1px solid #ffaa00; border-radius: 8px; background-color: transparent; color: #ffaa00; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s ease;"
                  onmouseover="this.style.backgroundColor='#ffaa00'; this.style.color='#080000'"
                  onmouseout="this.style.backgroundColor='transparent'; this.style.color='#ffaa00'">
            <div style="font-size: 14px; font-weight: bold;">Hard</div>
            <div style="font-size: 11px; margin-top: 4px; opacity: 0.8;" th:text="${fsrsHardLabel}">1d</div>
          </button>

          <!-- GOOD -->
          <button type="submit" name="fsrsRating" value="3"
                  style="flex: 1; padding: 12px 8px; border: none; border-radius: 8px; background-color: #6f0000; color: #ffd4d4; font-family: 'Inter', sans-serif; cursor: pointer; transition: background-color 0.15s ease;"
                  onmouseover="this.style.backgroundColor='#ff2a2a'"
                  onmouseout="this.style.backgroundColor='#6f0000'">
            <div style="font-size: 14px; font-weight: bold;">Good</div>
            <div style="font-size: 11px; margin-top: 4px; opacity: 0.8;" th:text="${fsrsGoodLabel}">5d</div>
          </button>

          <!-- EASY -->
          <button type="submit" name="fsrsRating" value="4"
                  style="flex: 1; padding: 12px 8px; border: 1px solid #00cc66; border-radius: 8px; background-color: transparent; color: #00cc66; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s ease;"
                  onmouseover="this.style.backgroundColor='#00cc66'; this.style.color='#080000'"
                  onmouseout="this.style.backgroundColor='transparent'; this.style.color='#00cc66'">
            <div style="font-size: 14px; font-weight: bold;">Easy</div>
            <div style="font-size: 11px; margin-top: 4px; opacity: 0.8;" th:text="${fsrsEasyLabel}">12d</div>
          </button>
        </form>

        <!-- ========== ФОРМА ДЛЯ ОСТАЛЬНЫХ РЕЖИМОВ - 2 кнопки ========== -->
        <form th:if="${mode != 'spaced'}"
              th:action="${isGlobal} ? @{/study/all/answer} : @{/decks/{deckId}/study/answer(deckId=${deckId})}"
              method="post"
              style="display: flex; justify-content: center; gap: 16px;">
          <input type="hidden" name="cardId" th:value="${card.id}" />

          <button type="submit" name="isCorrect" value="false"
                  style="padding: 8px 24px; border: 1px solid #ff2a2a; border-radius: 8px; background-color: transparent; color: #ff2a2a; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.15s ease; box-sizing: border-box;"
                  onmouseover="this.style.backgroundColor='#ff2a2a'; this.style.color='#080000'"
                  onmouseout="this.style.backgroundColor='transparent'; this.style.color='#ff2a2a'">
            Не знал
          </button>

          <button type="submit" name="isCorrect" value="true"
                  style="padding: 8px 24px; border: none; border-radius: 8px; background-color: #6f0000; color: #ffd4d4; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.15s ease; box-sizing: border-box;"
                  onmouseover="this.style.backgroundColor='#ff2a2a'"
                  onmouseout="this.style.backgroundColor='#6f0000'">
            Знал
          </button>
        </form>
      </div>
    </div>

    <!-- ========== РЕЖИМ TYPING ========== -->
    <div th:if="${mode == 'typing'}">
      <form th:action="${isGlobal} ? @{/study/all/answer} : @{/decks/{deckId}/study/answer(deckId=${deckId})}" method="post" id="typingForm">
        <input type="hidden" name="cardId" th:value="${card.id}" />

        <div style="margin-bottom: 16px;">
          <input type="text" name="typedAnswer" id="userAnswerInput" autocomplete="off" autofocus
                 placeholder="Введите ответ..."
                 style="width: 100%; padding: 12px 16px; border: 1px solid #330000; border-radius: 8px; background-color: #080000; color: #ffd4d4; font-family: 'Inter', sans-serif; font-size: 20px; text-align: center; outline: none; box-sizing: border-box; transition: border-color 0.15s ease;"
                 onfocus="this.style.borderColor='#ff2a2a'"
                 onblur="this.style.borderColor='#330000'" />
        </div>

        <button type="submit" style="width: 100%; padding: 12px 16px; border: none; border-radius: 8px; background-color: #6f0000; color: #ffd4d4; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.15s ease; box-sizing: border-box;" onmouseover="this.style.backgroundColor='#ff2a2a'" onmouseout="this.style.backgroundColor='#6f0000'">Проверить</button>
      </form>

      <p style="margin-top: 16px; color: #996666; font-size: 12px;">
        Подсказка: регистр и пробелы по краям не важны
      </p>
    </div>
  </div>
</div>

<!-- Кнопка прервать тренировку -->
<div style="position: fixed; bottom: 24px; left: 0; width: 100%; text-align: center;">
  <a th:href="${isGlobal} ? @{/} : @{/decks/{deckId}(deckId=${deckId})}" style="color: #996666; text-decoration: none; font-size: 14px; transition: color 0.15s ease;" onmouseover="this.style.color='#ff2a2a'" onmouseout="this.style.color='#996666'">Прервать тренировку</a>
</div>

<script>
  function toggleAnswer() {
    document.getElementById('answerBlock').style.display = 'block';
    document.getElementById('showAnswerBtn').style.display = 'none';
  }

  // Автофокус на поле ввода в режиме typing
  document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('userAnswerInput');
    if (input) input.focus();
  });
</script>
</body>
</html>
